services:
  robot-gateway:
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2.8}
    container_name: robot-gateway
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./robot_gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./robot_gateway/site:/srv:ro
      - robot_gateway_data:/data
      - robot_gateway_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  camera-snapshot:
    image: ${CAMERA_SNAPSHOT_IMAGE:-camera-snapshot:local}
    build:
      context: ./camera_snapshot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: camera-snapshot
    env_file:
      - .env
    ports:
      - "8099:8099"
    volumes:
      - camera_snapshot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  action-move:
    image: ${ACTION_MOVE_IMAGE:-action-move:local}
    build:
      context: ./action_move
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: action-move
    env_file:
      - .env
    environment:
      ACTION_SLAM_MAPPING_URL: http://slam-mapping:8301
    ports:
      - "8094:8094"
    volumes:
      - action_move_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  audio-recognition:
    image: ${AUDIO_RECOGNITION_IMAGE:-audio-recognition:local}
    build:
      context: ./audio_recognition
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: audio-recognition
    env_file:
      - .env
    environment:
      AUDIO_FACE_SERVER: http://smile-face:8096
      AUDIO_INTERACT_URL: http://audio-interact:8097
      AUDIO_SENSOR_SERVER: http://100.118.92.117:8088
    ports:
      - "8095:8095"
    volumes:
      - audio_recognition_data:/app/audio_recognition/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  audio-interact:
    image: ${AUDIO_INTERACT_IMAGE:-audio-interact:local}
    build:
      context: ./audio_interact
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: audio-interact
    env_file:
      - .env
    environment:
      AUDIO_RECOGNITION_URL: http://audio-recognition:8095
      COMMON_ASR_URL: https://www.wangyutang.cn/common/api/asr/transcribe
      AUDIO_INTERACT_DATA_DIR: /app/data
    ports:
      - "8097:8097"
    volumes:
      - audio_interact_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  pi5-robot:
    image: ${PI5_ROBOT_IMAGE:-pi5-robot:local}
    build:
      context: ./pi5_robot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: pi5-robot
    env_file:
      - .env
    ports:
      - "8093:8093"
    volumes:
      - pi5_robot_episodes:/app/episodes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  slam-mapping:
    image: ${SLAM_MAPPING_IMAGE:-slam-mapping:local}
    build:
      context: ./slam_mapping
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: slam-mapping
    env_file:
      - .env
    ports:
      - "8301:8301"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8301/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  smile-face:
    image: ${SMILE_FACE_IMAGE:-smile-face:local}
    build:
      context: ./smile_face
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: smile-face
    env_file:
      - .env
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  robot_gateway_data:
  robot_gateway_config:
  camera_snapshot_data:
  action_move_data:
  audio_recognition_data:
  audio_interact_data:
  pi5_robot_episodes:

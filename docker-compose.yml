services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    container_name: wangyutang-caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./control_platform/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      platform:
        condition: service_healthy
      paper-learning:
        condition: service_healthy
      remote-control-web:
        condition: service_started
      remote-control-api:
        condition: service_healthy
      remote-sensing:
        condition: service_healthy
      camera-snapshot:
        condition: service_started
      action-move:
        condition: service_healthy
      audio-recognition:
        condition: service_healthy
      web-manager:
        condition: service_healthy
      smile-face:
        condition: service_healthy
    restart: unless-stopped

  platform:
    image: ${CONTROL_PLATFORM_IMAGE:-control-platform:local}
    build:
      context: ./control_platform
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: control-platform
    env_file:
      - .env
    ports:
      - "8098:8098"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  paper-hermes:
    image: ${PAPER_HERMES_IMAGE:-paper-hermes:local}
    build:
      context: ./paper_learning_system
      dockerfile: Dockerfile.hermes
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: paper-hermes
    env_file:
      - .env
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  paper-learning:
    image: ${PAPER_LEARNING_IMAGE:-paper-learning-system:local}
    build:
      context: ./paper_learning_system
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: paper-learning-system
    env_file:
      - .env
    depends_on:
      paper-hermes:
        condition: service_healthy
    ports:
      - "8088:8088"
    volumes:
      - paper_learning_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  remote-control-mqtt:
    image: eclipse-mosquitto:2
    container_name: remote-control-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./remote_control_cloud/infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - remote_control_mqtt_data:/mosquitto/data
      - remote_control_mqtt_log:/mosquitto/log
    restart: unless-stopped

  remote-control-api:
    image: ${REMOTE_CONTROL_API_IMAGE:-remote-control-api:local}
    build:
      context: ./remote_control_cloud
      dockerfile: Dockerfile.api
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: remote-control-api
    env_file:
      - .env
    environment:
      MQTT_HOST: remote-control-mqtt
      MQTT_PORT: "1883"
    depends_on:
      - remote-control-mqtt
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  remote-control-web:
    image: ${REMOTE_CONTROL_WEB_IMAGE:-remote-control-web:local}
    build:
      context: ./remote_control_cloud
      dockerfile: Dockerfile.web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: remote-control-web
    env_file:
      - .env
    ports:
      - "5173:5173"
    restart: unless-stopped

  remote-sensing:
    image: ${REMOTE_SENSING_IMAGE:-remote-sensing-system:local}
    build:
      context: ./remote_sensing
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: remote-sensing
    env_file:
      - .env
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  camera-snapshot:
    image: ${CAMERA_SNAPSHOT_IMAGE:-camera-snapshot:local}
    build:
      context: ./camera_snapshot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: camera-snapshot
    env_file:
      - .env
    ports:
      - "8099:8099"
    volumes:
      - camera_snapshot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  action-move:
    image: ${ACTION_MOVE_IMAGE:-action-move:local}
    build:
      context: ./action_move
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: action-move
    env_file:
      - .env
    ports:
      - "8094:8094"
    volumes:
      - action_move_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  audio-recognition:
    image: ${AUDIO_RECOGNITION_IMAGE:-audio-recognition:local}
    build:
      context: ./audio_recognition
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: audio-recognition
    env_file:
      - .env
    environment:
      AUDIO_FACE_SERVER: http://smile-face:8096
    ports:
      - "8095:8095"
    volumes:
      - audio_recognition_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web-manager:
    image: ${WEB_MANAGER_IMAGE:-web-manager:local}
    build:
      context: ./llm_manager
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: web-manager
    env_file:
      - .env
    environment:
      WEB_MANAGER_REGISTRY_PATH: /app/control_platform/modules/registry.json
    ports:
      - "8092:8092"
    volumes:
      - llm_manager_data:/app/data
      - ./control_platform/modules/registry.json:/app/control_platform/modules/registry.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  pi5-robot:
    image: ${PI5_ROBOT_IMAGE:-pi5-robot:local}
    build:
      context: ./pi5_robot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: pi5-robot
    env_file:
      - .env
    ports:
      - "8093:8093"
    volumes:
      - pi5_robot_episodes:/app/episodes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  smile-face:
    image: ${SMILE_FACE_IMAGE:-smile-face:local}
    build:
      context: ./smile_face
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: smile-face
    env_file:
      - .env
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  paper_learning_data:
  camera_snapshot_data:
  action_move_data:
  audio_recognition_data:
  llm_manager_data:
  pi5_robot_episodes:
  remote_control_mqtt_data:
  remote_control_mqtt_log:

services:
  remote-control-mqtt:
    image: eclipse-mosquitto:2
    container_name: remote-control-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./remote_control_cloud/infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - remote_control_mqtt_data:/mosquitto/data
      - remote_control_mqtt_log:/mosquitto/log
    restart: unless-stopped

  remote-control-api:
    image: ${REMOTE_CONTROL_API_IMAGE:-remote-control-api:local}
    build:
      context: ./remote_control_cloud
      dockerfile: Dockerfile.api
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: remote-control-api
    env_file:
      - .env
    environment:
      MQTT_HOST: remote-control-mqtt
      MQTT_PORT: "1883"
    depends_on:
      - remote-control-mqtt
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  remote-control-web:
    image: ${REMOTE_CONTROL_WEB_IMAGE:-remote-control-web:local}
    build:
      context: ./remote_control_cloud
      dockerfile: Dockerfile.web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: remote-control-web
    env_file:
      - .env
    ports:
      - "5173:5173"
    restart: unless-stopped

  camera-snapshot:
    image: ${CAMERA_SNAPSHOT_IMAGE:-camera-snapshot:local}
    build:
      context: ./camera_snapshot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: camera-snapshot
    env_file:
      - .env
    ports:
      - "8099:8099"
    volumes:
      - camera_snapshot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  action-move:
    image: ${ACTION_MOVE_IMAGE:-action-move:local}
    build:
      context: ./action_move
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: action-move
    env_file:
      - .env
    ports:
      - "8094:8094"
    volumes:
      - action_move_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  audio-recognition:
    image: ${AUDIO_RECOGNITION_IMAGE:-audio-recognition:local}
    build:
      context: ./audio_recognition
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: audio-recognition
    env_file:
      - .env
    environment:
      AUDIO_FACE_SERVER: http://smile-face:8096
    ports:
      - "8095:8095"
    volumes:
      - audio_recognition_data:/app/audio_recognition/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  pi5-robot:
    image: ${PI5_ROBOT_IMAGE:-pi5-robot:local}
    build:
      context: ./pi5_robot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: pi5-robot
    env_file:
      - .env
    ports:
      - "8093:8093"
    volumes:
      - pi5_robot_episodes:/app/episodes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  smile-face:
    image: ${SMILE_FACE_IMAGE:-smile-face:local}
    build:
      context: ./smile_face
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: smile-face
    env_file:
      - .env
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  camera_snapshot_data:
  action_move_data:
  audio_recognition_data:
  pi5_robot_episodes:
  remote_control_mqtt_data:
  remote_control_mqtt_log:

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>位姿追踪</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; background: #1a1d27; border-bottom: 1px solid #2a2d3a; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; font-weight: 600; color: #a0aec0; letter-spacing: 1px; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5568; }
  #status-dot.connected { background: #48bb78; box-shadow: 0 0 6px #48bb78; }
  #status-text { font-size: 12px; color: #718096; }
  .main { display: flex; flex: 1; overflow: hidden; }
  #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  canvas { background: #13151f; border: 1px solid #2a2d3a; border-radius: 8px; }
  .sidebar { width: 240px; padding: 16px; border-left: 1px solid #2a2d3a; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .card { background: #1a1d27; border-radius: 8px; padding: 14px; }
  .card h2 { font-size: 11px; color: #718096; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .stat { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
  .stat-label { color: #718096; }
  .stat-value { color: #e2e8f0; font-variant-numeric: tabular-nums; }
  #description { font-size: 13px; line-height: 1.6; color: #a0aec0; }
  #imu-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-top: 6px; }
  #imu-badge.active { background: #1a3a2a; color: #48bb78; }
  #imu-badge.inactive { background: #2a2020; color: #f6ad55; }
  button { width: 100%; padding: 8px; border: 1px solid #2a2d3a; background: #1a1d27; color: #a0aec0; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #2a2d3a; color: #e2e8f0; }
</style>
</head>
<body>
<header>
  <h1>POSE TRACKER</h1>
  <div id="status-dot"></div>
  <span id="status-text">未连接</span>
</header>
<div class="main">
  <div id="canvas-wrap">
    <canvas id="map" width="600" height="600"></canvas>
  </div>
  <div class="sidebar">
    <div class="card">
      <h2>当前位姿</h2>
      <div class="stat"><span class="stat-label">X（前后）</span><span class="stat-value" id="val-x">0.000 m</span></div>
      <div class="stat"><span class="stat-label">Y（左右）</span><span class="stat-value" id="val-y">0.000 m</span></div>
      <div class="stat"><span class="stat-label">偏航角</span><span class="stat-value" id="val-yaw">0.0°</span></div>
      <div class="stat"><span class="stat-label">距起点</span><span class="stat-value" id="val-dist">0.0 cm</span></div>
    </div>
    <div class="card">
      <h2>运动描述</h2>
      <div id="description">等待数据…</div>
      <div id="imu-badge" class="inactive">指令推算</div>
    </div>
    <div class="card">
      <h2>操作</h2>
      <button onclick="resetPose()">重置起点</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;

// pixels per metre
let scale = 200;
let trail = [];
let current = { x: 0, y: 0, yaw: 0 };

function worldToCanvas(x, y) {
  // x=forward → up, y=left → left on screen
  return [CX + y * scale, CY - x * scale];
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = '#1e2130';
  ctx.lineWidth = 1;
  const gridStep = scale * 0.5; // 50cm grid
  for (let gx = CX % gridStep; gx < W; gx += gridStep) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (let gy = CY % gridStep; gy < H; gy += gridStep) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  // axes
  ctx.strokeStyle = '#2a2d3a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CX, 0); ctx.lineTo(CX, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, CY); ctx.lineTo(W, CY); ctx.stroke();

  // origin mark
  ctx.fillStyle = '#4a5568';
  ctx.beginPath(); ctx.arc(CX, CY, 4, 0, Math.PI * 2); ctx.fill();

  // trail
  if (trail.length > 1) {
    ctx.beginPath();
    const [sx, sy] = worldToCanvas(trail[0].x, trail[0].y);
    ctx.moveTo(sx, sy);
    for (let i = 1; i < trail.length; i++) {
      const [px, py] = worldToCanvas(trail[i].x, trail[i].y);
      ctx.lineTo(px, py);
    }
    ctx.strokeStyle = '#4299e1';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // robot arrow
  const [rx, ry] = worldToCanvas(current.x, current.y);
  const angle = -current.yaw; // canvas rotation: yaw CCW → negative angle in canvas coords
  const R = 14;

  ctx.save();
  ctx.translate(rx, ry);
  ctx.rotate(angle);

  // body circle
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fillStyle = '#2b4a7a';
  ctx.fill();
  ctx.strokeStyle = '#4299e1';
  ctx.lineWidth = 2;
  ctx.stroke();

  // heading arrow
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-R * 1.2, 0); // forward = up in canvas = negative Y after rotate
  ctx.strokeStyle = '#63b3ed';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // arrowhead
  ctx.beginPath();
  ctx.moveTo(-R * 1.2, 0);
  ctx.lineTo(-R * 0.8, -5);
  ctx.lineTo(-R * 0.8, 5);
  ctx.closePath();
  ctx.fillStyle = '#63b3ed';
  ctx.fill();

  ctx.restore();

  // scale bar
  const barW = scale * 0.5;
  ctx.fillStyle = '#4a5568';
  ctx.fillRect(20, H - 30, barW, 3);
  ctx.fillStyle = '#718096';
  ctx.font = '11px sans-serif';
  ctx.fillText('50 cm', 20, H - 35);
}

function update(data) {
  current = { x: data.x, y: data.y, yaw: data.yaw_deg * Math.PI / 180 };
  trail = data.trail || [];

  document.getElementById('val-x').textContent = data.x.toFixed(3) + ' m';
  document.getElementById('val-y').textContent = data.y.toFixed(3) + ' m';
  document.getElementById('val-yaw').textContent = data.yaw_deg.toFixed(1) + '°';
  document.getElementById('val-dist').textContent = data.dist_cm.toFixed(1) + ' cm';
  document.getElementById('description').textContent = data.description || '';

  const badge = document.getElementById('imu-badge');
  if (data.imu_active) {
    badge.textContent = 'IMU 融合';
    badge.className = 'active';
  } else {
    badge.textContent = '指令推算';
    badge.className = 'inactive';
  }

  // auto-scale: keep robot within 80% of canvas
  const dist = Math.hypot(data.x, data.y);
  if (dist > 0.01) {
    const needed = dist * 1.5;
    const desiredScale = (W * 0.4) / needed;
    scale = Math.max(50, Math.min(400, desiredScale));
  }

  draw();
}

// WebSocket
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('status-dot').className = 'connected';
    document.getElementById('status-text').textContent = '已连接';
  };
  ws.onmessage = e => update(JSON.parse(e.data));
  ws.onclose = () => {
    document.getElementById('status-dot').className = '';
    document.getElementById('status-text').textContent = '已断开，重连中…';
    setTimeout(connect, 2000);
  };
}

function resetPose() {
  fetch('/api/reset', { method: 'POST' });
}

connect();
draw();
</script>
</body>
</html>

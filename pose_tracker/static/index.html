<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>位姿追踪</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }

header {
  padding: 10px 20px;
  background: #1a1d27;
  border-bottom: 1px solid #2a2d3a;
  display: flex;
  align-items: center;
  gap: 14px;
}
header h1 { font-size: 14px; font-weight: 600; color: #a0aec0; letter-spacing: 1px; }

.dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5568; flex-shrink: 0; }
.dot.on  { background: #48bb78; box-shadow: 0 0 5px #48bb78; }
.dot.warn { background: #f6ad55; box-shadow: 0 0 5px #f6ad55; }

.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 4px;
  background: #2a2d3a; color: #718096;
}
.badge.on  { background: #1a3a2a; color: #48bb78; }
.badge.warn { background: #3a2a1a; color: #f6ad55; }

.spacer { flex: 1; }

/* control buttons */
.ctrl-btn {
  padding: 6px 18px; border-radius: 6px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s;
}
.ctrl-btn:disabled { opacity: .4; cursor: default; }
#btn-start { background: #276749; color: #9ae6b4; }
#btn-start:not(:disabled):hover { background: #2f855a; }
#btn-stop  { background: #742a2a; color: #feb2b2; }
#btn-stop:not(:disabled):hover  { background: #9b2c2c; }
#btn-reset { background: #2d3748; color: #a0aec0; }
#btn-reset:not(:disabled):hover { background: #4a5568; }

/* layout */
.main { display: flex; flex: 1; overflow: hidden; }
#canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; }
canvas { background: #13151f; border: 1px solid #2a2d3a; border-radius: 8px; cursor: crosshair; }

.sidebar {
  width: 220px; padding: 14px; border-left: 1px solid #2a2d3a;
  display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
}
.card { background: #1a1d27; border-radius: 8px; padding: 12px; }
.card h2 { font-size: 10px; color: #718096; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.stat { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
.stat-label { color: #718096; }
.stat-value { color: #e2e8f0; font-variant-numeric: tabular-nums; }
#description { font-size: 12px; line-height: 1.65; color: #a0aec0; }
</style>
</head>
<body>

<header>
  <h1>POSE TRACKER</h1>

  <div class="dot" id="dot-ws"></div>
  <span class="badge" id="badge-ws">服务器断开</span>

  <div class="dot" id="dot-pi"></div>
  <span class="badge" id="badge-pi">Pi 未连接</span>

  <div class="spacer"></div>

  <button class="ctrl-btn" id="btn-start" disabled>开始采集</button>
  <button class="ctrl-btn" id="btn-stop"  disabled>停止采集</button>
  <button class="ctrl-btn" id="btn-reset">重置起点</button>
</header>

<div class="main">
  <div id="canvas-wrap">
    <canvas id="map"></canvas>
  </div>
  <div class="sidebar">
    <div class="card">
      <h2>当前位姿</h2>
      <div class="stat"><span class="stat-label">X（前后）</span><span class="stat-value" id="v-x">0.000 m</span></div>
      <div class="stat"><span class="stat-label">Y（左右）</span><span class="stat-value" id="v-y">0.000 m</span></div>
      <div class="stat"><span class="stat-label">偏航角</span><span class="stat-value" id="v-yaw">0.0°</span></div>
      <div class="stat"><span class="stat-label">距起点</span><span class="stat-value" id="v-dist">0.0 cm</span></div>
    </div>
    <div class="card">
      <h2>运动描述</h2>
      <div id="description">等待数据…</div>
    </div>
  </div>
</div>

<script>
// ── canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const size = Math.min(wrap.clientWidth - 24, wrap.clientHeight - 24);
  canvas.width = canvas.height = Math.max(300, size);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const CX = () => canvas.width / 2;
const CY = () => canvas.height / 2;

// ── state ─────────────────────────────────────────────────────────────────────
let trail = [];             // {x, y, yaw}
let current = {x:0, y:0, yaw_deg:0};
let scale = 200;            // px / metre
let piConnected = false;
let streaming = false;
let dirty = false;          // needs redraw

function worldToCanvas(x, y) {
  // x=forward → up on screen, y=left → left on screen
  return [CX() + y * scale, CY() - x * scale];
}

// ── drawing ───────────────────────────────────────────────────────────────────
function draw() {
  if (!dirty) return;
  dirty = false;

  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // grid (50 cm steps)
  const step = scale * 0.5;
  ctx.strokeStyle = '#1c1f2e';
  ctx.lineWidth = 1;
  for (let x = CX() % step; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = CY() % step; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // axes
  ctx.strokeStyle = '#2a2d3a';
  ctx.beginPath(); ctx.moveTo(CX(),0); ctx.lineTo(CX(),H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,CY()); ctx.lineTo(W,CY()); ctx.stroke();

  // forward label
  ctx.fillStyle = '#4a5568'; ctx.font = '11px sans-serif';
  ctx.fillText('前', CX()+4, 14);

  // origin dot
  ctx.fillStyle = '#4a5568';
  ctx.beginPath(); ctx.arc(CX(), CY(), 3, 0, Math.PI*2); ctx.fill();

  // trail
  if (trail.length > 1) {
    ctx.beginPath();
    const [sx, sy] = worldToCanvas(trail[0].x, trail[0].y);
    ctx.moveTo(sx, sy);
    for (let i = 1; i < trail.length; i++) {
      const [px, py] = worldToCanvas(trail[i].x, trail[i].y);
      ctx.lineTo(px, py);
    }
    ctx.strokeStyle = '#4299e1';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // robot body + heading arrow
  const [rx, ry] = worldToCanvas(current.x, current.y);
  const angle = -(current.yaw_deg * Math.PI / 180);
  const R = 13;

  ctx.save();
  ctx.translate(rx, ry);
  ctx.rotate(angle);

  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI*2);
  ctx.fillStyle = streaming ? '#2b4a7a' : '#2d3748';
  ctx.fill();
  ctx.strokeStyle = streaming ? '#4299e1' : '#4a5568';
  ctx.lineWidth = 2; ctx.stroke();

  // arrow pointing forward (up in local frame = -y in canvas)
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -R*1.3);
  ctx.strokeStyle = streaming ? '#63b3ed' : '#718096';
  ctx.lineWidth = 2.5; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -R*1.3); ctx.lineTo(-5, -R*0.9); ctx.lineTo(5, -R*0.9);
  ctx.closePath();
  ctx.fillStyle = streaming ? '#63b3ed' : '#718096'; ctx.fill();

  ctx.restore();

  // scale bar
  const barW = scale * 0.5;
  ctx.fillStyle = '#4a5568'; ctx.fillRect(16, H-28, barW, 3);
  ctx.fillStyle = '#718096'; ctx.font = '10px sans-serif';
  ctx.fillText('50 cm', 16, H-32);
}

function loop() { draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ── data handling ─────────────────────────────────────────────────────────────
function applyFull(data) {
  trail = data.full_trail || [];
  applyCurrent(data);
}

function applyUpdate(data) {
  if (data.new_point) trail.push(data.new_point);
  if (trail.length > 2000) trail.splice(0, trail.length - 2000);
  applyCurrent(data);
}

function applyCurrent(data) {
  current = { x: data.x, y: data.y, yaw_deg: data.yaw_deg };

  document.getElementById('v-x').textContent    = data.x.toFixed(3) + ' m';
  document.getElementById('v-y').textContent    = data.y.toFixed(3) + ' m';
  document.getElementById('v-yaw').textContent  = data.yaw_deg.toFixed(1) + '°';
  document.getElementById('v-dist').textContent = data.dist_cm.toFixed(1) + ' cm';
  document.getElementById('description').textContent = data.description || '';

  // auto-scale
  const dist = Math.hypot(data.x, data.y);
  if (dist > 0.05) {
    const desired = (canvas.width * 0.38) / (dist * 1.5);
    scale = Math.max(40, Math.min(500, desired));
  }

  dirty = true;
}

function applyStatus(data) {
  piConnected = !!data.pi_connected;
  streaming   = !!data.streaming;

  const dotPi   = document.getElementById('dot-pi');
  const badgePi = document.getElementById('badge-pi');
  dotPi.className   = 'dot' + (piConnected ? ' on' : '');
  badgePi.className = 'badge' + (piConnected ? ' on' : '');
  badgePi.textContent = piConnected ? 'Pi 已连接' : 'Pi 未连接';

  document.getElementById('btn-start').disabled = !piConnected || streaming;
  document.getElementById('btn-stop').disabled  = !piConnected || !streaming;

  dirty = true;
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('dot-ws').className = 'dot on';
    document.getElementById('badge-ws').className = 'badge on';
    document.getElementById('badge-ws').textContent = '已连接';
  };

  ws.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.status_update) { applyStatus(data); return; }
    if (data.full_trail !== undefined) { applyFull(data); applyStatus(data); }
    else { applyUpdate(data); applyStatus(data); }
  };

  ws.onclose = () => {
    document.getElementById('dot-ws').className = 'dot warn';
    document.getElementById('badge-ws').className = 'badge warn';
    document.getElementById('badge-ws').textContent = '断开，重连中…';
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled  = true;
    setTimeout(connect, 2000);
  };
}

// ── buttons ───────────────────────────────────────────────────────────────────
document.getElementById('btn-start').onclick = () => fetch('/api/start', {method:'POST'});
document.getElementById('btn-stop').onclick  = () => fetch('/api/stop',  {method:'POST'});
document.getElementById('btn-reset').onclick = () => fetch('/api/reset', {method:'POST'});

connect();
dirty = true;
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TurboPi Action Move</title>
    <link rel="stylesheet" href="./static/style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>TurboPi Action Move</h1>
          <p>树莓派 5 / TurboPi 运动、朝向和摄像头云台控制队列。</p>
        </div>
        <div class="device-block">
          <div class="status" id="deviceStatus">检查中...</div>
          <div class="device-meta" id="deviceInfo">等待网络信息</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>安全控制</h2>
          <span id="unitSummary">距离 5 cm · 转向 5° · 灵敏度 1x</span>
        </div>
        <div class="safety-grid">
          <button class="danger" data-action="emergency_stop">急停</button>
          <button class="secondary" data-action="reset_pose">Reset</button>
          <button class="danger" data-action="remote_shutdown">远程关机</button>
          <button class="secondary" id="voiceVolumeOnBtn" type="button">打开音量</button>
          <button class="secondary" id="voiceVolumeOffBtn" type="button">关闭音量</button>
        </div>
      </section>

      <section class="panel sonar-panel">
        <div class="panel-title">
          <h2>超声波测距</h2>
          <div class="title-actions">
            <span id="sonarSummary">正在读取</span>
            <button class="small" data-action="front_distance" type="button">刷新测距</button>
          </div>
        </div>
        <div class="sonar-card" id="sonarCard">
          <div class="sonar-distance">
            <strong id="sonarDistanceValue">--</strong>
            <span>cm</span>
          </div>
          <div class="sonar-meta" id="sonarMeta">等待设备上报超声波结果</div>
          <div class="sonar-raw" id="sonarRaw"></div>
        </div>
      </section>

      <section class="panel camera-panel">
        <div class="panel-title">
          <h2>相机小窗</h2>
          <label class="toggle-line">
            <input id="cameraPreviewToggle" type="checkbox" />
            <span>开启</span>
          </label>
        </div>
        <div class="camera-preview disabled" id="cameraPreview">
          <div class="camera-frame">
            <img id="cameraPreviewImage" alt="相机最新画面" />
            <div class="camera-symbol" id="cameraSymbol" aria-hidden="true">
              <span class="camera-body"><span class="camera-lens"></span></span>
            </div>
          </div>
          <div class="camera-status" id="cameraPreviewStatus">未开启</div>
          <canvas id="cameraCompareCanvas" width="80" height="60"></canvas>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>单位设置</h2>
          <button class="small" id="saveSettingsBtn" type="button">保存</button>
        </div>
        <form class="settings-form" id="settingsForm">
          <label>
            <span>运动单位距离</span>
            <input id="unitDistanceInput" type="number" min="1" max="50" step="1" value="5" />
            <em>cm</em>
          </label>
          <label>
            <span>转向角度单位</span>
            <input id="turnAngleInput" type="number" min="1" max="90" step="1" value="5" />
            <em>°</em>
          </label>
          <label>
            <span>灵敏度</span>
            <input id="sensitivityInput" type="number" min="0.2" max="2" step="0.1" value="1" />
            <em>x</em>
          </label>
        </form>
      </section>

      <section class="panel rgb-panel">
        <div class="panel-title">
          <h2>RGB 灯光</h2>
          <span id="rgbSummary">默认关闭</span>
        </div>
        <div class="rgb-controls">
          <label class="rgb-picker-line">
            <span class="rgb-swatch" id="rgbSwatch" aria-hidden="true"></span>
            <span>选择颜色</span>
            <input id="rgbColorInput" type="color" value="#000000" />
          </label>
          <form class="settings-form rgb-settings" id="rgbSettingsForm">
            <label>
              <span>红</span>
              <input id="rgbRedInput" type="number" min="0" max="255" step="1" value="0" />
              <em>R</em>
            </label>
            <label>
              <span>绿</span>
              <input id="rgbGreenInput" type="number" min="0" max="255" step="1" value="0" />
              <em>G</em>
            </label>
            <label>
              <span>蓝</span>
              <input id="rgbBlueInput" type="number" min="0" max="255" step="1" value="0" />
              <em>B</em>
            </label>
          </form>
          <div class="grid two">
            <button data-action="rgb_on">开灯 / 应用颜色</button>
            <button class="secondary" data-action="rgb_off">关灯</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>摄像头朝向</h2>
          <span>水平舵机和俯仰舵机</span>
        </div>
        <div class="grid">
          <button data-action="look_left">向左看</button>
          <button data-action="look_right">向右看</button>
          <button data-action="look_up">向上看</button>
          <button data-action="look_down">向下看</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>前后左右运动</h2>
          <span id="moveUnitLabel">按一次执行 5 cm</span>
        </div>
        <div class="pad">
          <span></span>
          <button data-action="move_forward">向前走</button>
          <span></span>
          <button data-action="move_left">向左走</button>
          <button data-action="move_backward">向后走</button>
          <button data-action="move_right">向右走</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>朝向</h2>
          <span id="turnUnitLabel">按一次转 5°</span>
        </div>
        <div class="grid two">
          <button data-action="turn_left">向左转</button>
          <button data-action="turn_right">向右转</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <h2>任务</h2>
          <button class="small" id="refreshBtn">刷新</button>
        </div>
        <div class="tasks" id="tasks"></div>
      </section>

    </main>
    <script src="./static/app.js?v=20260611-logs-sonar"></script>
  </body>
</html>

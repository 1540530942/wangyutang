name: Deploy camera_snapshot

on:
  workflow_dispatch:
    inputs:
      deploy_pi:
        description: "Update Raspberry Pi sender and systemd service"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    paths:
      # Deploy whenever camera_snapshot or its face-render dependency changes.
      - "camera_snapshot/**"
      - "smile_face/**"
      - "scripts/github_deploy_camera_snapshot.sh"
      - ".github/workflows/deploy-camera-snapshot.yml"

concurrency:
  group: camera-snapshot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
      TENCENT_USER: ${{ secrets.TENCENT_USER }}
      TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      PI_HOST: ${{ secrets.PI_HOST }}
      PI_USER: ${{ secrets.PI_USER }}
      PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
      PI_PORT: ${{ secrets.PI_PORT || '10022' }}
      DEPLOY_PI: ${{ github.event_name == 'push' && 'true' || inputs.deploy_pi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy scope
        run: |
          deploy_smile_face=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy_smile_face=true
          else
            changed="$(git diff --name-only HEAD^ HEAD || true)"
            if printf '%s\n' "$changed" | grep -q '^smile_face/'; then
              deploy_smile_face=true
            fi
          fi
          echo "DEPLOY_SMILE_FACE=$deploy_smile_face" >> "$GITHUB_ENV"
          echo "deploy_smile_face=$deploy_smile_face"

      - name: Validate camera module
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run syntax checks
        run: |
          python -m py_compile camera_snapshot/server.py camera_snapshot/pi_camera_sender.py smile_face/server.py smile_face/fb_renderer.py smile_face/face_render.py

      - name: Run camera smoke tests
        run: |
          python -m pip install -r camera_snapshot/requirements.txt
          python -m pip install httpx
          python -m unittest discover -s camera_snapshot/tests

      - name: Create release archive
        run: |
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='camera_snapshot/data' \
            --exclude='camera_snapshot/dist' \
            -czf camera_snapshot-${GITHUB_SHA}.tgz \
            camera_snapshot smile_face scripts/github_deploy_camera_snapshot.sh

      - name: Check deployment secrets
        id: deploy_secrets
        run: |
          cloud_ready=false
          if [ -n "$TENCENT_HOST" ] && [ -n "$TENCENT_USER" ] && [ -n "$TENCENT_SSH_PRIVATE_KEY" ]; then
            cloud_ready=true
          fi

          pi_ready=false
          if [ -n "$PI_HOST" ] && [ -n "$PI_USER" ] && [ -n "$PI_SSH_PRIVATE_KEY" ] && [ -n "$PI_PORT" ]; then
            pi_ready=true
          fi

          echo "cloud_ready=$cloud_ready" >> "$GITHUB_OUTPUT"
          echo "pi_ready=$pi_ready" >> "$GITHUB_OUTPUT"

          if [ "$cloud_ready" != "true" ]; then
            echo "::notice::Tencent Cloud secrets are not configured; skipping remote camera deployment."
          fi
          if [ "$DEPLOY_PI" = "true" ] && [ "$pi_ready" != "true" ]; then
            echo "::notice::Raspberry Pi secrets are not configured; skipping Pi sender update."
          fi

      - name: Configure SSH
        if: steps.deploy_secrets.outputs.cloud_ready == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TENCENT_SSH_PRIVATE_KEY" > ~/.ssh/tencent_key
          chmod 600 ~/.ssh/tencent_key
          {
            echo "Host tencent-prod"
            echo "  HostName $TENCENT_HOST"
            echo "  User $TENCENT_USER"
            echo "  IdentityFile ~/.ssh/tencent_key"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          if [ "$DEPLOY_PI" = "true" ] && [ "${{ steps.deploy_secrets.outputs.pi_ready }}" = "true" ]; then
            printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_key
            chmod 600 ~/.ssh/pi_key
            {
              echo "Host pi-camera"
              echo "  HostName $PI_HOST"
              echo "  User $PI_USER"
              echo "  Port $PI_PORT"
              echo "  IdentityFile ~/.ssh/pi_key"
              echo "  ProxyJump tencent-prod"
              echo "  StrictHostKeyChecking accept-new"
            } >> ~/.ssh/config
          fi

      - name: Upload release to Tencent Cloud
        if: steps.deploy_secrets.outputs.cloud_ready == 'true'
        run: |
          ssh tencent-prod "mkdir -p /tmp/wangyutang-camera-deploy"
          scp camera_snapshot-${GITHUB_SHA}.tgz tencent-prod:/tmp/wangyutang-camera-deploy/

      - name: Apply cloud release
        if: steps.deploy_secrets.outputs.cloud_ready == 'true'
        run: |
          ssh tencent-prod \
            "DEPLOY_SMILE_FACE='${DEPLOY_SMILE_FACE}' bash -s -- '/tmp/wangyutang-camera-deploy/camera_snapshot-${GITHUB_SHA}.tgz' '${GITHUB_SHA}'" \
            < scripts/github_deploy_camera_snapshot.sh

      - name: Update Raspberry Pi sender
        if: env.DEPLOY_PI == 'true' && steps.deploy_secrets.outputs.cloud_ready == 'true' && steps.deploy_secrets.outputs.pi_ready == 'true'
        run: |
          scp camera_snapshot/pi_camera_sender.py pi-camera:/tmp/pi_camera_sender.py
          scp camera_snapshot/systemd/camera-snapshot-sender.service pi-camera:/tmp/camera-snapshot-sender.service
          ssh pi-camera '
            set -euo pipefail
            install -m 0644 /tmp/pi_camera_sender.py /home/pi/pi_camera_sender.py
            sudo install -m 0644 /tmp/camera-snapshot-sender.service /etc/systemd/system/camera-snapshot-sender.service
            sudo rm -f /etc/systemd/system/camera-snapshot-sender.service.d/override.conf
            sudo rmdir /etc/systemd/system/camera-snapshot-sender.service.d 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable camera-snapshot-sender.service
            sudo systemctl restart camera-snapshot-sender.service
            systemctl is-active --quiet camera-snapshot-sender.service
            ps -ef | grep -E "pi_camera_sender.py" | grep -v grep
          '

      - name: Verify public camera flow
        if: steps.deploy_secrets.outputs.cloud_ready == 'true'
        run: |
          python - <<'PY'
          import io
          import json
          import pathlib
          import time
          import urllib.request
          from PIL import Image

          base = "https://www.wangyutang.cn/camera"

          def get_json(path):
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_json(path, payload):
              data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          def get_jpeg(path):
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  return response.read()

          def similarity_score(a_bytes, b_bytes):
              image_a = Image.open(io.BytesIO(a_bytes)).convert("RGB").resize((320, 240))
              image_b = Image.open(io.BytesIO(b_bytes)).convert("RGB").resize((320, 240))
              pixels_a = list(image_a.getdata())
              pixels_b = list(image_b.getdata())
              total = 0
              for (ar, ag, ab), (br, bg, bb) in zip(pixels_a, pixels_b):
                  total += abs(ar - br) + abs(ag - bg) + abs(ab - bb)
              mean_abs = total / (len(pixels_a) * 3)
              score = 1.0 - (mean_abs / 255.0)
              return max(0.0, min(1.0, score))

          html = urllib.request.urlopen(base + "/", timeout=20).read().decode("utf-8")
          labels = (
              "".join(chr(value) for value in (0x6444, 0x50CF, 0x673A, 0x622A, 0x56FE)),
              "".join(chr(value) for value in (0x5C4F, 0x5E55, 0x622A, 0x56FE)),
              "".join(chr(value) for value in (0x8868, 0x60C5, 0x622A, 0x56FE)),
          )
          for label in labels:
              if label not in html:
                  raise SystemExit(f"missing button label: {label}")

          health = get_json("/api/health")
          if health.get("status") != "ok":
              raise SystemExit(f"/api/health invalid response: {json.dumps(health, ensure_ascii=False)}")

          golden_dir = pathlib.Path("camera_snapshot/tests/golden")
          golden_paths = {
              "single": golden_dir / "golden_camerashot.jpg",
              "screenshot": golden_dir / "golden_screenshot.jpg",
              "face": golden_dir / "golden_face.jpg",
          }
          for mode, path in golden_paths.items():
              if not path.exists():
                  raise SystemExit(f"missing golden image for {mode}: {path}")

          golden_bytes = {mode: path.read_bytes() for mode, path in golden_paths.items()}

          camera_sources = {"web-video-server", "rpicam-still", "picamera2", "opencv"}
          expected_sources = {
              "camera": camera_sources,
              "screen": {"screenshot"},
              "face": {"smile-face-render"},
          }
          actual = {}

          for kind, mode in (("camera", "single"), ("screen", "single"), ("face", "single")):
              task = post_json("/api/capture", {"kind": kind, "mode": mode, "query_gpio": 26})["task"]
              deadline = time.time() + 40
              latest = {}
              while time.time() < deadline:
                  time.sleep(2)
                  latest = get_json(f"/api/latest?kind={kind}")
                  if latest.get("task_id") != task["id"]:
                      continue
                  source = latest.get("capture_source") or ""
                  if source not in expected_sources[kind]:
                      raise SystemExit(f"{kind} capture_source invalid: {source}")
                  frame = get_jpeg(f"/api/latest.jpg?kind={kind}&t={int(time.time()*1000)}")
                  actual[kind] = {
                      "source": source,
                      "bytes": frame,
                      "task_id": task["id"],
                  }
                  print(f"OK kind={kind} mode={mode} task={task['id']} source={source} size={len(frame)}")
                  break
              else:
                  raise SystemExit(
                      f"kind={kind} no valid frame in time: latest={json.dumps(latest, ensure_ascii=False)}"
                  )

          # Layer 3: actual vs matching golden image similarity thresholds.
          score_screen = similarity_score(actual["screen"]["bytes"], golden_bytes["screenshot"])
          score_face = similarity_score(actual["face"]["bytes"], golden_bytes["face"])
          if score_screen < 0.85:
              raise SystemExit(f"screenshot similarity too low: {score_screen:.4f} < 0.85")
          if score_face < 0.85:
              raise SystemExit(f"face similarity too low: {score_face:.4f} < 0.85")

          # Layer 4: anti-mode-mixing checks.
          cam_vs_cam = similarity_score(actual["camera"]["bytes"], golden_bytes["single"])
          cam_vs_screen = similarity_score(actual["camera"]["bytes"], golden_bytes["screenshot"])
          cam_vs_face = similarity_score(actual["camera"]["bytes"], golden_bytes["face"])
          if cam_vs_screen >= cam_vs_cam:
              raise SystemExit(
                  f"camera shot too close to screenshot: cam_vs_screen={cam_vs_screen:.4f} cam_vs_cam={cam_vs_cam:.4f}"
              )
          if cam_vs_face >= cam_vs_cam:
              raise SystemExit(
                  f"camera shot too close to face: cam_vs_face={cam_vs_face:.4f} cam_vs_cam={cam_vs_cam:.4f}"
              )

          screen_vs_cam = similarity_score(actual["screen"]["bytes"], golden_bytes["single"])
          if screen_vs_cam >= score_screen:
              raise SystemExit(
                  f"screenshot too close to camera shot: screen_vs_cam={screen_vs_cam:.4f} "
                  f"screen_vs_screen={score_screen:.4f}"
              )

          face_vs_cam = similarity_score(actual["face"]["bytes"], golden_bytes["single"])
          if face_vs_cam >= score_face:
              raise SystemExit(
                  f"face too close to camera shot: face_vs_cam={face_vs_cam:.4f} face_vs_face={score_face:.4f}"
              )

          # Layer 5: golden-set self-check.
          golden_cam_vs_screen = similarity_score(golden_bytes["single"], golden_bytes["screenshot"])
          golden_cam_vs_face = similarity_score(golden_bytes["single"], golden_bytes["face"])
          if golden_cam_vs_screen > 0.50:
              raise SystemExit(
                  f"golden camera and screenshot are too similar: {golden_cam_vs_screen:.4f} (must be <= 0.50)"
              )
          if golden_cam_vs_face > 0.50:
              raise SystemExit(
                  f"golden camera and face are too similar: {golden_cam_vs_face:.4f} (must be <= 0.50)"
              )

          summary = {
              "screen_vs_golden_screen": round(score_screen, 4),
              "face_vs_golden_face": round(score_face, 4),
              "camera_vs_golden_camera": round(cam_vs_cam, 4),
              "camera_vs_golden_screen": round(cam_vs_screen, 4),
              "camera_vs_golden_face": round(cam_vs_face, 4),
              "screen_vs_golden_camera": round(screen_vs_cam, 4),
              "face_vs_golden_camera": round(face_vs_cam, 4),
              "golden_camera_vs_golden_screen": round(golden_cam_vs_screen, 4),
              "golden_camera_vs_golden_face": round(golden_cam_vs_face, 4),
          }
          print("VERIFICATION_SUMMARY", json.dumps(summary, ensure_ascii=False))
          PY

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TurboPi Camera Snapshot</title>
  <link rel="stylesheet" href="./static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TurboPi</p>
        <h1>Camera Snapshot</h1>
      </div>
      <div id="statusBadge" class="badge">未连接</div>
    </header>

    <section class="viewer">
      <img id="cameraImage" alt="TurboPi camera latest frame">
      <div id="emptyState" class="empty">等待拍照任务</div>
    </section>

    <section class="controls">
      <button id="singleButton" class="primary" type="button">单帧发送</button>
      <button id="screenshotButton" type="button">截图上传</button>
      <button id="inspectButton" type="button">巡检快照</button>
      <button id="continuousButton" type="button">持续发送</button>
      <button id="downloadButton" type="button">保存到本地</button>
      <label class="field">
        <span>频率</span>
        <select id="intervalSelect">
          <option value="200">5 fps</option>
          <option value="500">2 fps</option>
          <option value="1000" selected>1 fps</option>
          <option value="2000">0.5 fps</option>
          <option value="5000">0.2 fps</option>
        </select>
      </label>
      <label class="field">
        <span>查询 GPIO</span>
        <select id="gpioSelect">
          <option value="26" selected>GPIO26 LED2</option>
          <option value="16">GPIO16 LED1</option>
          <option value="13">GPIO13 KEY1</option>
          <option value="23">GPIO23 KEY2</option>
          <option value="4">GPIO4</option>
          <option value="5">GPIO5</option>
          <option value="6">GPIO6</option>
          <option value="12">GPIO12</option>
          <option value="17">GPIO17</option>
          <option value="22">GPIO22</option>
          <option value="24">GPIO24</option>
          <option value="25">GPIO25</option>
          <option value="27">GPIO27</option>
        </select>
      </label>
      <button id="refreshButton" type="button">刷新</button>
    </section>

    <section class="meta">
      <div><span>设备</span><strong id="deviceId">-</strong></div>
      <div><span>帧 ID</span><strong id="frameId">-</strong></div>
      <div><span>更新时间</span><strong id="updatedAt">-</strong></div>
      <div><span>大小</span><strong id="contentLength">-</strong></div>
      <div><span>来源</span><strong id="captureSource">-</strong></div>
      <div><span>引脚状态</span><strong id="gpioState">-</strong></div>
      <div><span>采样时间</span><strong id="gpioSampledAt">-</strong></div>
      <div><span>树莓派</span><strong id="deviceOnline">-</strong></div>
      <div><span>任务</span><strong id="taskState">-</strong></div>
    </section>

    <section class="inspection">
      <div class="section-title">
        <p class="eyebrow">Inspection</p>
        <h2>远程巡检</h2>
      </div>
      <div class="inspection-grid">
        <div><span>主机</span><strong id="inspectHost">-</strong></div>
        <div><span>温度</span><strong id="inspectTemp">-</strong></div>
        <div><span>电压</span><strong id="inspectThrottle">-</strong></div>
        <div><span>Wi-Fi</span><strong id="inspectWifi">-</strong></div>
        <div><span>IP</span><strong id="inspectIp">-</strong></div>
        <div><span>网关</span><strong id="inspectGateway">-</strong></div>
        <div><span>运行时间</span><strong id="inspectUptime">-</strong></div>
        <div><span>磁盘</span><strong id="inspectDisk">-</strong></div>
        <div><span>服务</span><strong id="inspectService">-</strong></div>
        <div><span>负载</span><strong id="inspectLoad">-</strong></div>
      </div>
    </section>
  </main>
  <script src="./static/app.js?v=20260511-watermark-refresh"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设备终端 · WALLE</title>
    <link rel="stylesheet" href="/devices/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <div>
          <div class="crumbs"><a href="/">← 返回首页</a></div>
          <h1>设备终端</h1>
          <p class="lead">联网设备的在线状态、WiFi 信号与远程控制</p>
        </div>
        <button class="refresh" id="refresh">刷新</button>
      </div>

      <!-- 离线告警 -->
      <div id="alerts-wrap"></div>

      <!-- 搜索框 -->
      <div class="search-bar">
        <input id="search" type="search" placeholder="搜索设备名称 / ID / 类型…" autocomplete="off" />
      </div>

      <!-- 批量控制 -->
      <div class="batch-bar">
        <select id="batch-action">
          <option value="identify">辨认（闪灯/响一声）</option>
          <option value="reboot">重启</option>
        </select>
        <button class="btn" id="batch-online">下发全部在线设备</button>
        <button class="btn" id="batch-all">下发全部设备</button>
      </div>

      <div class="grid" id="grid">
        <div class="empty">加载中…</div>
      </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
      const API = "/devices/api";
      let allDevices = [];
      let searchTerm = "";

      function fmtAge(sec) {
        if (!sec) return "—";
        const d = Math.max(0, Math.floor(Date.now() / 1000 - sec));
        if (d < 60) return d + " 秒前";
        if (d < 3600) return Math.floor(d / 60) + " 分钟前";
        if (d < 86400) return Math.floor(d / 3600) + " 小时前";
        return Math.floor(d / 86400) + " 天前";
      }
      function rssiLabel(r) {
        if (r === undefined || r === null || r === "") return "—";
        let q = "弱";
        if (r >= -55) q = "极佳";
        else if (r >= -67) q = "良好";
        else if (r >= -75) q = "一般";
        return r + " dBm · " + q;
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      }
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      /* ── 告警面板 ── */
      async function loadAlerts() {
        try {
          const r = await fetch(API + "/alerts?limit=10", { cache: "no-store" });
          const j = await r.json();
          const alerts = (j.alerts || []).filter((a) => Date.now() / 1000 - a.ts < 86400);
          const wrap = document.getElementById("alerts-wrap");
          if (!alerts.length) { wrap.innerHTML = ""; return; }
          wrap.innerHTML =
            '<div class="alert-banner"><h3>⚠ 离线告警（近 24h）</h3>' +
            alerts.map((a) => {
              const ago = fmtAge(a.ts);
              return `<div class="alert-item"><span>${esc(a.device_name)} 离线已 ${a.gone_for_s}s</span>` +
                     `<span class="alert-time">${ago}</span></div>`;
            }).join("") +
            "</div>";
        } catch (_) { /* ignore */ }
      }

      /* ── 设备列表 ── */
      async function load() {
        try {
          const r = await fetch(API + "/list", { cache: "no-store" });
          const j = await r.json();
          allDevices = j.devices || [];
          renderDevices();
        } catch (e) {
          document.getElementById("grid").innerHTML =
            '<div class="empty">加载失败：' + esc(e.message) + "</div>";
        }
        loadAlerts();
      }

      function renderDevices() {
        const grid = document.getElementById("grid");
        const term = searchTerm.toLowerCase();
        const filtered = term
          ? allDevices.filter((d) =>
              d.name.toLowerCase().includes(term) ||
              d.device_id.toLowerCase().includes(term) ||
              (d.device_type || "").toLowerCase().includes(term)
            )
          : allDevices;
        if (!filtered.length) {
          grid.innerHTML = allDevices.length
            ? '<div class="empty">没有匹配"' + esc(searchTerm) + '"的设备</div>'
            : '<div class="empty">还没有设备上线。<br/>设备按契约 POST /devices/api/register 后会出现在这里。</div>';
          return;
        }
        grid.innerHTML = filtered.map(cardHtml).join("");
      }

      function cardHtml(d) {
        const st = d.state || {};
        const cls = d.online ? "online" : "offline";
        const label = d.online ? "在线" : "离线";
        const pend = d.pending_commands
          ? '<span class="dot">待执行 ' + d.pending_commands + "</span>"
          : "";
        return `
          <a class="card" href="/devices/device?id=${encodeURIComponent(d.device_id)}">
            <div class="card-head">
              <div>
                <h2>${esc(d.name)}</h2>
                <p class="sub">${esc(d.device_type)} · ${esc(d.device_id)}</p>
              </div>
              <span class="dot ${cls}">${label}</span>
            </div>
            <div class="metrics">
              <div class="metric"><div class="k">WiFi</div><div class="v">${esc(st.wifi_ssid || "—")}</div></div>
              <div class="metric"><div class="k">信号</div><div class="v">${esc(rssiLabel(st.wifi_rssi))}</div></div>
              <div class="metric"><div class="k">IP</div><div class="v">${esc(st.ip || "—")}</div></div>
              <div class="metric"><div class="k">最后心跳</div><div class="v">${fmtAge(d.last_seen)}</div></div>
            </div>
            <div style="margin-top:12px">${pend}</div>
          </a>`;
      }

      /* ── 批量下发 ── */
      async function batchSend(onlineOnly) {
        const action = document.getElementById("batch-action").value;
        const targets = onlineOnly ? allDevices.filter((d) => d.online).map((d) => d.device_id) : null;
        if (onlineOnly && (!targets || !targets.length)) { toast("没有在线设备"); return; }
        const label = onlineOnly ? `全部在线设备（${targets.length}台）` : `全部设备（${allDevices.length}台）`;
        if (!confirm(`向 ${label} 下发指令：${action}？`)) return;
        try {
          const body = targets ? { device_ids: targets, action } : { action };
          const r = await fetch(API + "/batch_command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const j = await r.json();
          if (j.ok) {
            const ok = Object.values(j.results || {}).filter((v) => v.ok).length;
            toast(`已下发 ${action} → ${ok} 台设备`);
            load();
          } else toast("下发失败：" + (j.message || j.error));
        } catch (e) { toast("下发失败：" + e.message); }
      }

      document.getElementById("search").addEventListener("input", (e) => {
        searchTerm = e.target.value.trim();
        renderDevices();
      });
      document.getElementById("refresh").addEventListener("click", load);
      document.getElementById("batch-online").addEventListener("click", () => batchSend(true));
      document.getElementById("batch-all").addEventListener("click", () => batchSend(false));

      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Common 模块</title>
    <link rel="stylesheet" href="./static/style.css" />
    <style>
      .hub {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 32px;
      }
      .hub-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border: 1px solid #d5dddf;
        border-radius: 12px;
        padding: 28px 24px;
        background: #ffffff;
        text-decoration: none;
        color: inherit;
        transition: box-shadow 0.15s, border-color 0.15s;
      }
      .hub-card:hover {
        border-color: #126c64;
        box-shadow: 0 4px 18px rgba(18, 108, 100, 0.12);
      }
      .hub-card .tag {
        display: inline-block;
        border: 1px solid #b8c5c8;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
        color: #52656a;
        width: fit-content;
      }
      .hub-card h2 {
        font-size: 20px;
        margin: 0;
      }
      .hub-card p {
        margin: 0;
        color: #52656a;
        font-size: 14px;
        line-height: 1.6;
      }
      .hub-card strong {
        margin-top: auto;
        color: #126c64;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">WALLE / Common API</p>
          <h1>公共模块</h1>
        </div>
      </header>

      <div class="hub">
        <a class="hub-card" href="./model-studio">
          <span class="tag">AI Models</span>
          <h2>Model Studio</h2>
          <p>查看和验证已部署的 AI 模型（语音、视觉、对话），支持实时推理测试和模型切换。</p>
          <strong>打开 /common/model-studio</strong>
        </a>
        <a class="hub-card" href="./robot-skills">
          <span class="tag">Control</span>
          <h2>Robot Skills</h2>
          <p>机器人技能控制台，执行底盘、云台、RGB 和预定义动作序列。</p>
          <strong>打开 /common/robot-skills</strong>
        </a>
      </div>
    </main>
  </body>
</html>

version: 1
defaults:
  max_action_duration_ms: 1000
  max_turn_duration_ms: 800
  max_face_duration_ms: 5000
  observation_ttl_ms:
    camera_snapshot: 2000
    front_distance: 2000
    get_robot_state: 5000
    inspect_scene: 15000
  safety_thresholds:
    min_front_distance_estimate_cm: 15
skills:
  - id: emergency_stop
    route: action
    tool: emergency_stop
    max_duration_ms: 0
    risk: low
    aliases: [stop, e-stop]
  - id: move_forward
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    risk: medium
    pre_conditions:
      - front_distance_clear
    aliases: [forward]
  - id: move_backward
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [backward]
  - id: move_left
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [move left]
  - id: move_right
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [move right]
  - id: turn_left
    route: action
    tool: dispatch_action
    max_duration_ms: 800
    aliases: [turn left, 左转, 左拐, 朝左转, 向左旋转, 往左转, 往左拐, 向左拐]
  - id: turn_right
    route: action
    tool: dispatch_action
    max_duration_ms: 800
    aliases: [turn right, 右转, 右拐, 朝右转, 向右旋转, 往右转, 往右拐, 向右拐]
  - id: look_left
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [look left, 左看, 左边看, 看左边, 向左边看, 摄像头向左, 镜头向左, 舵机向左转]
  - id: look_right
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [look right, 右看, 右边看, 看右边, 向右边看, 摄像头向右, 镜头向右, 舵机向右转]
  - id: look_up
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [look up, 抬头看, 看上面, 向上看, 摄像头向上, 镜头向上, 舵机向上转]
  - id: look_down
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [look down, 低头看, 看下面, 向下看, 摄像头向下, 镜头向下, 舵机向下转]
  - id: reset_pose
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [reset]
  - id: rgb_on
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [rgb on, light on, 开灯, 打开灯光]
  - id: rgb_off
    route: action
    tool: dispatch_action
    max_duration_ms: 1000
    aliases: [rgb off, light off, 关灯, 关闭灯光]
  - id: camera_snapshot
    route: observation
    tool: camera_snapshot
    max_duration_ms: 5000
    aliases: [camera snapshot, snapshot, take photo, 看一下前面, 看看前面, 看一下前方, 看看前方, 拍照, 拍一张, 拍一下]
  - id: front_distance
    route: observation
    tool: front_distance
    max_duration_ms: 2000
    aliases: [front distance, distance ahead, 前方距离, 前面距离, 测距, 看看距离, 前面有多远]
  - id: inspect_scene
    route: observation
    tool: inspect_scene
    max_duration_ms: 15000
    aliases:
      - inspect scene
      - 前面有没有人
      - 有没有人
      - 前面有人吗
      - 前方有人吗
      - 看看前面有没有人
      - 前面是什么
      - 前方有什么
      - 帮我看看前面
      - 前面有障碍物吗
      - 前面有什么障碍
      - 分析一下前面
  - id: face_neutral
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [neutral]
  - id: face_happy
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [happy]
  - id: face_joy
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [joy]
  - id: face_sad
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [sad]
  - id: face_angry
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [angry]
  - id: face_speak
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [speak]
  - id: face_mouth_open
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [mouth open]
  - id: face_blink
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [blink]
  - id: face_reset
    route: face
    tool: dispatch_face
    max_duration_ms: 5000
    aliases: [face reset]

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Insights</title>
    <link rel="stylesheet" href="/static/visitor_insights.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Hidden Page</p>
          <h1>访客登记与行为记录</h1>
          <p>仅记录本页内的登记、访问、停留与点击事件；不做跨站追踪，不采集密码、精确位置或浏览器指纹。</p>
        </div>
        <button id="adminUnlockBtn" type="button">管理查看</button>
      </header>

      <section class="panel">
        <div class="panel-title">
          <h2>访客登记</h2>
          <span id="registerStatus">等待填写</span>
        </div>
        <form id="visitorForm" class="visitor-form">
          <label>
            <span>姓名/称呼</span>
            <input id="visitorName" maxlength="80" autocomplete="name" />
          </label>
          <label>
            <span>联系方式</span>
            <input id="visitorContact" maxlength="120" autocomplete="email" />
          </label>
          <label class="wide">
            <span>访问目的</span>
            <input id="visitorPurpose" maxlength="300" />
          </label>
          <label class="wide">
            <span>备注</span>
            <textarea id="visitorNote" maxlength="500" rows="3"></textarea>
          </label>
          <label class="consent wide">
            <input id="visitorConsent" type="checkbox" />
            <span>我同意记录本页内的登记信息和基础行为事件，用于站点体验分析。</span>
          </label>
          <button type="submit">提交登记</button>
        </form>
      </section>

      <section class="panel admin-panel" id="adminPanel" hidden>
        <div class="panel-title">
          <h2>管理看板</h2>
          <button id="refreshAdminBtn" type="button">刷新</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="table-wrap">
          <h3>登记记录</h3>
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>称呼</th>
                <th>联系方式</th>
                <th>目的</th>
                <th>IP</th>
              </tr>
            </thead>
            <tbody id="registrationRows"></tbody>
          </table>
        </div>
        <div class="table-wrap">
          <h3>行为事件</h3>
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>事件</th>
                <th>页面</th>
                <th>目标</th>
                <th>停留</th>
              </tr>
            </thead>
            <tbody id="eventRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/static/visitor_insights.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>需求与奇思妙想记录</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260520-ideas" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Future Systems</p>
          <h1>需求与奇思妙想记录</h1>
          <p class="lead">留下你希望接入的实控系统、机器人能力、传感器网络、实验设备或任何值得试一试的想法。</p>
        </div>
        <div class="topbar-actions">
          <a class="status-pill" href="/">返回首页</a>
        </div>
      </header>

      <section class="idea-panel">
        <form id="ideaForm" class="idea-form">
          <label>
            <span>称呼</span>
            <input id="ideaName" maxlength="80" autocomplete="name" placeholder="可以留空" />
          </label>
          <label>
            <span>联系方式</span>
            <input id="ideaContact" maxlength="120" autocomplete="email" placeholder="邮箱、微信或其他方式，可留空" />
          </label>
          <label class="wide">
            <span>想法标题</span>
            <input id="ideaPurpose" maxlength="300" placeholder="例如：给机器人加一个室内巡航地图" required />
          </label>
          <label class="wide">
            <span>详细描述</span>
            <textarea id="ideaNote" maxlength="500" rows="7" placeholder="写下应用场景、希望看到的效果、已有设备或任何补充信息。"></textarea>
          </label>
          <label class="consent wide">
            <input id="ideaConsent" type="checkbox" checked />
            <span>同意保存这条需求记录，用于后续模块规划和联系沟通。</span>
          </label>
          <div class="idea-actions wide">
            <button type="submit">提交记录</button>
            <span id="ideaStatus" class="muted">等待填写</span>
          </div>
        </form>
      </section>
    </main>
    <script src="/static/ideas.js"></script>
  </body>
</html>
